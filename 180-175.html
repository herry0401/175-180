<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>180 ♥ 175</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=LXGW+WenKai+TC:wght@400;700&display=swap">
<style>
  /* Layout: one sketchbook page taped to a desk; the animation is the hero, caption + controls sit under it. Single deliberate look in both themes. */
  :root {
    --desk: #dfe6ef;
    --paper: #f7f9fc;
    --ink: #22304a;
    --ink-soft: #5a6884;
    --pink: #e5567f;
    --tape: rgba(229, 86, 127, .28);
    --hand: "LXGW WenKai TC", "Kaiti TC", "BiauKai", "STKaiti", "KaiTi", serif;
  }
  [hidden] { display: none !important; }
  html, body { margin: 0; background: var(--desk); color: var(--ink); }
  body { font-family: var(--hand); padding-inline: 16px; padding-block: 28px 40px; }
  .wrap { max-width: 860px; margin: 0 auto; display: flex; flex-direction: column; gap: 18px; }
  header { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
  h1 { margin: 0; font-size: 30px; font-weight: 700; letter-spacing: .04em; text-wrap: balance; }
  h1 .h { color: var(--pink); }
  header p { margin: 0; color: var(--ink-soft); font-size: 15px; }
  .page { position: relative; background: var(--paper); border: 2px solid var(--ink); border-radius: 4px; box-shadow: 6px 6px 0 rgba(34, 48, 74, .18); }
  .page::before, .page::after { content: ""; position: absolute; top: -12px; width: 86px; height: 24px; background: var(--tape); }
  .page::before { left: 22px; transform: rotate(-4deg); }
  .page::after { right: 22px; transform: rotate(5deg); }
  canvas { display: block; width: 100%; aspect-ratio: 16 / 10; cursor: pointer; border-radius: 3px; }
  nav { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  button { font-family: var(--hand); font-size: 17px; color: var(--ink); background: var(--paper); border: 2px solid var(--ink); border-radius: 999px; padding: 8px 20px; cursor: pointer; box-shadow: 3px 3px 0 rgba(34, 48, 74, .2); }
  button:hover { background: #fff; }
  button:active { transform: translate(2px, 2px); box-shadow: 1px 1px 0 rgba(34, 48, 74, .2); }
  button:disabled { opacity: .35; cursor: default; }
  .act { display: flex; justify-content: center; }
  #eat, #shoot, #walk { background: var(--pink); border-color: var(--ink); color: #fff; font-weight: 700; font-size: 19px; padding: 10px 26px; }
  #eat:hover, #shoot:hover, #walk:hover { background: #d9466f; }
  #eat:disabled, #shoot:disabled, #walk:disabled { opacity: 1; background: var(--paper); color: var(--ink); }
  #next.pulse { background: var(--pink); color: #fff; animation: nudge 1.2s ease-in-out infinite; }
  @keyframes nudge { 50% { transform: translateX(5px); } }
  button:focus-visible { outline: 3px solid var(--pink); outline-offset: 3px; }
  .dots { display: flex; gap: 10px; }
  .dots span { width: 11px; height: 11px; border-radius: 50%; border: 2px solid var(--ink); }
  .dots span.on { background: var(--pink); border-color: var(--pink); }

  /* ending: the application form */
  :root { --seal: #c8283c; }
  .form { position: relative; overflow: hidden; padding: clamp(20px, 5vw, 44px) clamp(16px, 5vw, 48px); display: flex; flex-direction: column; gap: 14px; }
  .doc-no { display: flex; justify-content: space-between; flex-wrap: wrap; gap: 8px; font-size: 14px; color: var(--ink-soft); letter-spacing: .06em; }
  .form h2 { margin: 0; text-align: center; font-size: clamp(30px, 6vw, 44px); letter-spacing: .5em; padding-left: .5em; font-weight: 700; }
  .table-wrap { overflow-x: auto; }
  .form table { width: 100%; border-collapse: collapse; font-size: clamp(16px, 2.6vw, 19px); border: 2.5px solid var(--ink); }
  .form th, .form td { border: 1.5px solid var(--ink); padding: 10px 12px; text-align: left; vertical-align: middle; }
  .form th { width: 6.5em; white-space: nowrap; font-weight: 700; letter-spacing: .3em; background: rgba(34, 48, 74, .05); }
  .form td.reason { height: 130px; background: repeating-linear-gradient(transparent 0 31px, rgba(34, 48, 74, .18) 31px 32px); }
  .decide { display: flex; gap: 14px; flex-wrap: wrap; }
  .decide button { min-width: 7em; font-weight: 700; }
  .decide .approve { background: var(--seal); color: #fff; }
  .decide .approve:hover { background: #b01f33; }
  #result { font-weight: 700; color: var(--seal); }
  .sign { display: flex; justify-content: flex-end; gap: 24px; flex-wrap: wrap; font-size: 16px; }
  .stamp { position: absolute; right: 9%; bottom: 13%; width: 116px; height: 116px; border: 5px solid var(--seal); border-radius: 50%; color: var(--seal); display: grid; place-items: center; font-size: 38px; font-weight: 700; letter-spacing: .1em; box-shadow: inset 0 0 0 4px var(--paper), inset 0 0 0 6px var(--seal); transform: rotate(-14deg); opacity: .88; mix-blend-mode: multiply; pointer-events: none; }
  .stamp.in { animation: stamp .45s cubic-bezier(.3, 1.6, .5, 1) both; }
  @keyframes stamp { from { transform: rotate(-14deg) scale(2.6); opacity: 0; } to { transform: rotate(-14deg) scale(1); opacity: .88; } }
  .fly { position: absolute; bottom: -30px; color: var(--pink); pointer-events: none; animation: fly 2.8s ease-out forwards; }
  @keyframes fly { to { transform: translate(var(--dx), -520px) rotate(var(--r)); opacity: 0; } }
  /* after approval: fake "sent" notice, then the reveal, then a tiny epilogue */
  .mail { border-top: 2px dashed rgba(34, 48, 74, .35); padding-top: 16px; display: flex; flex-direction: column; align-items: center; gap: 10px; text-align: center; }
  .mail .status { font-size: clamp(18px, 3vw, 22px); font-weight: 700; }
  .mail .status.ok { color: #2f8a52; }
  .mail .when { font-size: 15px; color: #5a6884; }
  .bar { width: min(320px, 100%); height: 12px; border: 2px solid var(--ink); border-radius: 8px; overflow: hidden; }
  .bar i { display: block; height: 100%; width: 0; background: var(--pink); transition: width 2.2s ease-out; }
  .mail .fine { font-size: clamp(15px, 2.4vw, 17px); color: var(--seal); font-weight: 700; }
  .mail canvas { width: 100%; aspect-ratio: 800 / 220; display: block; border-radius: 10px; }
  .appear { animation: appear .6s ease-out both; }
  @keyframes appear { from { opacity: 0; transform: translateY(8px); } }
  @media (prefers-reduced-motion: reduce) { .stamp.in, .fly, .appear { animation: none; } .fly { display: none; } .bar i { transition: none; } }
</style>
</head>
<body>

<div class="wrap">
  <header>
    <h1>180 <span class="h">♥</span> 175</h1>
  </header>
  <div class="page">
    <canvas id="c" aria-label="火柴人動畫"></canvas>
    <div class="form" id="form" hidden>
      <div class="doc-no"><span>文號：180 字第 175 號</span><span>速別：最速件</span></div>
      <h2>申請書</h2>
      <div class="table-wrap">
        <table>
          <tr><th>申請人</th><td>180</td><th>受理人</th><td>175</td></tr>
          <tr><th>申請日期</th><td colspan="3" id="date"></td></tr>
          <tr><th>主旨</th><td colspan="3"><strong>申請與 175 正式交往，請惠予核准。</strong></td></tr>
          <tr><th>檢附資料</th><td colspan="3">壽司七盤、電影一場、投籃機 <span id="hoopScore">0</span> 分、焙茶銀河流沙巧克力裂縫一個、尿急一次、主的訊息 <span id="msgCount">0</span> 則、鯛魚燒一份、論文一份（希望）</td></tr>
          <tr><th>審核結果</th><td colspan="3">
            <div class="decide" id="decide"><button id="yes" class="approve" type="button">核准</button><button id="no" type="button">駁回</button></div>
            <span id="result" hidden>核准。即日起生效。</span>
          </td></tr>
        </table>
      </div>
      <div class="sign"><span>申請人簽章：180</span><span>受理人簽章：175</span></div>
      <div class="stamp" id="stamp" hidden>核准</div>
      <div class="mail" id="mail" hidden>
        <div class="status" id="mailStatus">公文傳送中……</div>
        <div class="bar" id="mailBar"><i></i></div>
        <div class="when" id="mailWhen" hidden></div>
        <div class="fine appear" id="mailFine" hidden>（騙你的，網頁寄不出去。請截圖傳給 180 🙏）</div>
        <canvas class="appear" id="epi" hidden></canvas>
      </div>
    </div>
  </div>
  <div class="act" id="act" hidden><button id="eat" type="button"></button><button id="shoot" type="button" hidden></button><button id="walk" type="button" hidden>散步 👣</button></div>
  <nav>
    <button id="prev" type="button">← 上一幕</button>
    <div class="dots" id="dots"></div>
    <button id="next" type="button">下一幕 →</button>
  </nav>
</div>

<script>
const INK = '#22304a', PAPER = '#f7f9fc', GRID = '#dde6f2', PINK = '#e5567f', SALMON = '#f28c5b';
const c = document.getElementById('c');
let ctx = c.getContext('2d');
const W = 800, H = 500;
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;

function resize() {
  const dpr = Math.min(devicePixelRatio || 1, 2);
  c.width = c.clientWidth * dpr; c.height = c.clientWidth * 0.625 * dpr;
  ctx.setTransform(c.width / W, 0, 0, c.height / H, 0, 0);
}
addEventListener('resize', resize);

// ---------- helpers ----------
const lerp = (a, b, k) => a + (b - a) * k;
const clamp = (v, a = 0, b = 1) => Math.max(a, Math.min(b, v));
const ease = k => { k = clamp(k); return k * k * (3 - 2 * k); };
const lerpPose = (p, q, k) => [lerp(p[0], q[0], k), lerp(p[1], q[1], k)];
const crossed = (prev, now, period, mark) => Math.floor((prev - mark) / period) < Math.floor((now - mark) / period);

function limb(st, [a1, a2], l1, l2, f) {
  const p1 = { x: st.x + Math.sin(a1) * l1 * f, y: st.y + Math.cos(a1) * l1 };
  const a = a1 + a2;
  return { p0: st, p1, p2: { x: p1.x + Math.sin(a) * l2 * f, y: p1.y + Math.cos(a) * l2 }, a };
}

const ARM_REST = [0.15, 0.1], LEG_F = [0.14, 0], LEG_B = [-0.14, 0];
const SIT_F = [1.5, -1.45], SIT_B = [1.42, -1.38];

function geo(o) {
  const f = o.f || 1, s = o.s || 1, lean = o.lean || 0, bob = o.bob || 0;
  const N = { x: Math.sin(lean) * 58 * f, y: -Math.cos(lean) * 58 };
  const S = { x: N.x * 0.9, y: N.y + 6 };
  const Hd = { x: N.x + Math.sin(lean) * 17 * f, y: N.y - 17 };
  return {
    f, s, N, S, Hd,
    armF: limb(S, o.armF || ARM_REST, 26, 24, f),
    armB: limb(S, o.armB || [-0.15, 0.1], 26, 24, f),
    legF: limb({ x: 0, y: 0 }, o.legF || LEG_F, 32, 32, f),
    legB: limb({ x: 0, y: 0 }, o.legB || LEG_B, 32, 32, f),
    abs: p => ({ x: o.x + p.x * s, y: o.y + bob + p.y * s }),
  };
}

function path(l) { ctx.beginPath(); ctx.moveTo(l.p0.x, l.p0.y); ctx.lineTo(l.p1.x, l.p1.y); ctx.lineTo(l.p2.x, l.p2.y); ctx.stroke(); }

function drawHead(x, y, f, o) {
  const r = 15, col = o.col || INK;
  ctx.fillStyle = col;
  if (o.hair) { // long hair falling behind
    ctx.beginPath();
    ctx.moveTo(x, y - r - 4);
    ctx.quadraticCurveTo(x - f * (r + 10), y - 6, x - f * (r + 7), y + 34);
    ctx.lineTo(x - f * 2, y + 30);
    ctx.lineTo(x + f * 6, y + 10);
    ctx.closePath(); ctx.fill();
  }
  ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2);
  ctx.fillStyle = o.face || PAPER; ctx.fill(); ctx.stroke();
  if (o.hair) { // fringe
    ctx.fillStyle = col; ctx.beginPath();
    ctx.arc(x, y, r + 3, Math.PI, Math.PI * 2);
    ctx.quadraticCurveTo(x + f * 4, y - 15, x - r - 3, y);
    ctx.fill();
  }
  const ex1 = x + f * 1.5, ex2 = x + f * 10, ey = y - 1;
  if (o.glasses) {
    ctx.save(); ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(ex1, ey, 4.3, 0, Math.PI * 2); ctx.stroke();
    ctx.beginPath(); ctx.arc(ex2, ey, 4.3, 0, Math.PI * 2); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(ex1 + f * 4.3, ey); ctx.lineTo(ex2 - f * 4.3, ey); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(ex1 - f * 4.3, ey); ctx.lineTo(x - f * 12, y - 3); ctx.stroke();
    ctx.restore();
  }
  ctx.fillStyle = col;
  ctx.save(); ctx.lineWidth = 2;
  if (o.laugh) {
    for (const ex of [ex1, ex2]) { ctx.beginPath(); ctx.moveTo(ex - 2.5, ey + 1); ctx.lineTo(ex, ey - 2); ctx.lineTo(ex + 2.5, ey + 1); ctx.stroke(); }
    ctx.beginPath(); ctx.arc(x + f * 6, y + 4, 5, 0, Math.PI); ctx.closePath(); ctx.fill();
  } else {
    for (const ex of [ex1, ex2]) { ctx.beginPath(); ctx.arc(ex, ey, 1.6, 0, Math.PI * 2); ctx.fill(); }
    if (o.sad) { ctx.beginPath(); ctx.arc(x + f * 6, y + 10, 4, 1.15 * Math.PI, 1.85 * Math.PI); ctx.stroke(); }
    else { ctx.beginPath(); ctx.arc(x + f * 6, y + 5, 4, 0.15 * Math.PI, 0.85 * Math.PI); ctx.stroke(); }
  }
  ctx.restore();
  if (o.blush) {
    ctx.save(); ctx.globalAlpha = 0.55 * o.blush; ctx.fillStyle = PINK;
    for (const bx of [x - f * 3, x + f * 13]) { ctx.beginPath(); ctx.ellipse(bx, y + 4, 3.5, 2.2, 0, 0, Math.PI * 2); ctx.fill(); }
    ctx.restore();
  }
}

function person(o) {
  const g = geo(o);
  ctx.save();
  ctx.translate(o.x, o.y + (o.bob || 0)); ctx.scale(g.s, g.s);
  ctx.strokeStyle = o.col || INK; ctx.lineWidth = 3.2; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  ctx.globalAlpha = 0.45; path(g.legB); path(g.armB); ctx.globalAlpha = 1;
  ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(g.N.x, g.N.y); ctx.stroke();
  path(g.legF); path(g.armF);
  if (o.prop) o.prop(g.armF.p2, g.armF.a, g.f);
  drawHead(g.Hd.x, g.Hd.y, o.hf || g.f, o);
  ctx.restore();
  return g.abs(g.armF.p2);
}

function heartPath(x, y, s) {
  ctx.beginPath();
  ctx.moveTo(x, y + s / 4);
  ctx.bezierCurveTo(x, y, x - s / 2, y, x - s / 2, y + s / 4);
  ctx.bezierCurveTo(x - s / 2, y + s / 2, x, y + s * 0.65, x, y + s * 0.85);
  ctx.bezierCurveTo(x, y + s * 0.65, x + s / 2, y + s / 2, x + s / 2, y + s / 4);
  ctx.bezierCurveTo(x + s / 2, y, x, y, x, y + s / 4);
}

// floating particles (hearts and "+2")
let parts = [];
function spawn(x, y, n = 1, kind = 'heart', spread = 1, col = PINK) {
  for (let i = 0; i < n; i++) parts.push({
    x, y, kind, col, life: 0, max: 1.8 + Math.random() * 0.6,
    vx: (Math.random() - 0.5) * 50 * spread, vy: -40 - Math.random() * 30, size: 14 + Math.random() * 10,
  });
}
function drawParts(dt) {
  parts = parts.filter(p => (p.life += dt) < p.max);
  for (const p of parts) {
    p.x += p.vx * dt; p.y += p.vy * dt; p.vx *= 0.97;
    ctx.save(); ctx.globalAlpha = 1 - p.life / p.max;
    if (p.kind === 'heart') { heartPath(p.x, p.y, p.size); ctx.fillStyle = PINK; ctx.fill(); }
    else { ctx.fillStyle = p.col; ctx.font = '700 26px "LXGW WenKai TC", serif'; ctx.textAlign = 'center'; ctx.fillText(p.kind, p.x, p.y); }
    ctx.restore();
  }
}

function paper(margin = true) {
  ctx.fillStyle = PAPER; ctx.fillRect(0, 0, W, H);
  ctx.strokeStyle = GRID; ctx.lineWidth = 1;
  ctx.beginPath();
  for (let x = 25; x < W; x += 25) { ctx.moveTo(x, 0); ctx.lineTo(x, H); }
  for (let y = 25; y < H; y += 25) { ctx.moveTo(0, y); ctx.lineTo(W, y); }
  ctx.stroke();
  if (margin) { ctx.strokeStyle = 'rgba(229,86,127,.35)'; ctx.beginPath(); ctx.moveTo(48, 0); ctx.lineTo(48, H); ctx.stroke(); }
}
function line(x1, y1, x2, y2, w = 3, col = INK) { ctx.strokeStyle = col; ctx.lineWidth = w; ctx.lineCap = 'round'; ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke(); }

// ---------- scene 0: cover ----------
function sceneCover(t, prev) {
  paper();
  ctx.fillStyle = INK; ctx.textAlign = 'center';
  ctx.font = '700 76px "LXGW WenKai TC", serif';
  ctx.fillText('180', 300, 150); ctx.fillText('175', 500, 150);
  const pulse = 1 + 0.12 * Math.sin(t * 5);
  heartPath(400, 102 - 18 * pulse, 40 * pulse); ctx.fillStyle = PINK; ctx.fill();
  ctx.font = '22px "LXGW WenKai TC", serif'; ctx.fillStyle = '#5a6884';
  ctx.fillText('正式申請書', 400, 200);
  line(120, 424, 680, 424, 2.5);
  for (let x = 140; x < 680; x += 46) { line(x, 424, x - 4, 416, 1.5); line(x + 6, 424, x + 8, 417, 1.5); }
  const wave = [2.7 + 0.35 * Math.sin(t * 7), 0.5];
  person({ x: 340, y: 360, f: 1, glasses: true, bob: -Math.abs(Math.sin(t * 3)) * 4, armF: wave });
  person({ x: 460, y: 360, f: -1, hair: true, bob: -Math.abs(Math.sin(t * 3 + 1)) * 4, armF: [2.7 + 0.35 * Math.sin(t * 7 + 1), 0.5] });
  if (crossed(prev, t, 1.4, 0.2)) spawn(400, 300, 1);
}

// ---------- scene 1: sushi ----------
const PLATES = ['#3d7bd9', '#e04b4b', '#e2b23c', '#4aa86b', '#9a6bd1'];
function sushi(x, y, col) {
  ctx.lineWidth = 2; ctx.strokeStyle = INK;
  ctx.beginPath(); ctx.ellipse(x, y, 24, 6.5, 0, 0, Math.PI * 2); ctx.fillStyle = '#fff'; ctx.fill(); ctx.stroke();
  ctx.beginPath(); ctx.ellipse(x, y, 24, 6.5, 0, 0, Math.PI * 2); ctx.strokeStyle = col; ctx.lineWidth = 2.5; ctx.stroke();
  ctx.strokeStyle = INK; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.roundRect(x - 14, y - 15, 28, 11, 5); ctx.fillStyle = '#fff'; ctx.fill(); ctx.stroke();
  ctx.beginPath(); ctx.roundRect(x - 16, y - 21, 32, 8, 4); ctx.fillStyle = SALMON; ctx.fill(); ctx.stroke();
  ctx.strokeStyle = '#fff'; ctx.lineWidth = 1.5;
  for (const dx of [-8, 0, 8]) { ctx.beginPath(); ctx.moveTo(x + dx - 2, y - 19); ctx.lineTo(x + dx + 3, y - 15); ctx.stroke(); }
}
function stack(x, y, n) {
  for (let i = 0; i < n; i++) {
    ctx.beginPath(); ctx.ellipse(x, y - i * 5, 18, 5, 0, 0, Math.PI * 2);
    ctx.fillStyle = PLATES[i % PLATES.length]; ctx.fill(); ctx.strokeStyle = INK; ctx.lineWidth = 1.6; ctx.stroke();
  }
}
const chopsticks = (h, a, f) => {
  ctx.save(); ctx.strokeStyle = '#8a5a3c'; ctx.lineWidth = 2;
  const dx = Math.sin(a) * f, dy = Math.cos(a);
  for (const o of [-2, 2]) { ctx.beginPath(); ctx.moveTo(h.x + o * dy, h.y - o * dx); ctx.lineTo(h.x + dx * 24, h.y + dy * 24 + o); ctx.stroke(); }
  ctx.restore();
};
const SUSHI_MAX = 7, EAT_TIME = 1.3;
const meal = { count: 0, eatAt: -99 };
function sceneSushi(t, prev) {
  sceneDone = meal.count >= SUSHI_MAX && t - meal.eatAt > EAT_TIME + 1.2;
  paper();
  // noren curtain
  line(220, 26, 580, 26, 4);
  '迴轉壽司'.split('').forEach((ch, i) => {
    const x = 226 + i * 88, sway = Math.sin(t * 1.5 + i) * 2;
    ctx.beginPath(); ctx.moveTo(x, 26); ctx.lineTo(x + 84, 26); ctx.lineTo(x + 84 + sway, 104); ctx.lineTo(x + sway, 104); ctx.closePath();
    ctx.fillStyle = '#2f4a7a'; ctx.fill(); ctx.strokeStyle = INK; ctx.lineWidth = 2; ctx.stroke();
    ctx.fillStyle = '#f7f9fc'; ctx.font = '700 34px "LXGW WenKai TC", serif'; ctx.textAlign = 'center'; ctx.fillText(ch, x + 42 + sway / 2, 78);
  });
  // conveyor belt
  ctx.fillStyle = '#d3dcea'; ctx.fillRect(0, 196, W, 24);
  line(0, 196, W, 196, 2.5); line(0, 220, W, 220, 2.5);
  for (let x = -40 + (t * 55) % 40; x < W; x += 40) line(x, 200, x, 216, 1, '#9aa8c0');
  for (let i = 0; i < 7; i++) sushi(((i * 150 + t * 55) % 1050) - 120, 196, PLATES[i % PLATES.length]);
  // floor, table, stools
  line(60, 412, 740, 412, 2.5);
  ctx.fillStyle = '#e9d6bd'; ctx.strokeStyle = INK; ctx.lineWidth = 2.5;
  ctx.beginPath(); ctx.rect(310, 356, 180, 9); ctx.fill(); ctx.stroke();
  line(325, 365, 325, 412); line(475, 365, 475, 412);
  for (const x of [252, 548]) { line(x - 16, 382, x + 16, 382, 4); line(x - 10, 382, x - 14, 412, 2.5); line(x + 10, 382, x + 14, 412, 2.5); }

  // plates only stack up when the viewer presses 吃下一盤

      ctx.fillStyle = '#1e6b4a'; ctx.beginPath(); ctx.arc(x, 329, 3.5, 0, Math.PI * 2); ctx.fill();
    }
    const tap = a => [1.15, 0.35 + 0.08 * Math.sin(t * 24 + a)];
    // 175 writes; 180 sits beside her, chin in hand, watching
    person({ x: 372, y: 380, f: 1, glasses: true, legF: [1.5, -1.5], legB: [1.42, -1.42], armF: [0.75, 2.3], armB: [1.1, 0.4], lean: 0.12, blush: 0.8 });
    person({ x: 482, y: 380, f: 1, hair: true, legF: SIT_F, legB: SIT_B, armF: tap(2), armB: tap(3), lean: 0.05 });
    if (crossed(prev, t, 1.7, 0.8)) spawn(392, 270, 1);
  } else {
    // MRT station with a restroom
    ctx.fillStyle = '#e8edf3'; ctx.fillRect(0, 0, W, H);
    ctx.strokeStyle = '#cfd8e4'; ctx.lineWidth = 1;
    for (let x = 0; x < W; x += 40) { ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, 300); ctx.stroke(); }
    ctx.fillStyle = '#3d7bd9'; ctx.fillRect(0, 200, W, 14);
    ctx.fillStyle = '#1b2236'; ctx.strokeStyle = INK; ctx.lineWidth = 2.5;
    ctx.beginPath(); ctx.rect(150, 40, 230, 56); ctx.fill(); ctx.stroke();
    ctx.fillStyle = '#fff'; ctx.font = '700 30px "LXGW WenKai TC", serif'; ctx.textAlign = 'center'; ctx.fillText('捷運站', 265, 79);
    ctx.fillStyle = '#c9d3e0'; ctx.fillRect(0, 300, W, 124); line(0, 300, W, 300, 2.5);
    ctx.fillStyle = '#ffd34d'; ctx.fillRect(0, 440, W, 10);
    ctx.fillStyle = '#9aa8c0'; ctx.fillRect(0, 424, W, 16); line(0, 424, W, 424, 2.5);
    // restroom
    const DOOR = 650;
    ctx.fillStyle = '#4aa86b'; ctx.beginPath(); ctx.rect(DOOR - 40, 214, 80, 34); ctx.fill(); ctx.stroke();
    ctx.fillStyle = '#fff'; ctx.font = '700 22px "LXGW WenKai TC", serif'; ctx.fillText('廁所', DOOR, 239);
    const c = Math.max(0, T - PAIN_START), cycle = Math.floor(c / PAIN_CYCLE), u = c - cycle * PAIN_CYCLE;
    const doorOpen = Math.max(clamp((u - 1.9) / 0.2) * (1 - clamp((u - 2.3) / 0.2)), clamp((u - 3.5) / 0.2) * (1 - clamp((u - 3.9) / 0.2)));
    ctx.fillStyle = '#1b2236'; ctx.fillRect(DOOR - 30, 262, 60, 162);
    ctx.fillStyle = '#7a9cc6'; ctx.beginPath(); ctx.rect(DOOR - 30, 262, 60 * (1 - doorOpen * 0.85), 162); ctx.fill(); ctx.stroke();
    if (doorOpen < 0.5) { ctx.fillStyle = INK; ctx.beginPath(); ctx.arc(DOOR + 18, 344, 3, 0, Math.PI * 2); ctx.fill(); }
    // 180 waits
    const waiting = u > 2.3 && u < 3.6;
    person({ x: 300, y: 360, f: 1, glasses: true, armF: [0.3, 0.2], armB: [-0.2, 0.2], legF: waiting ? [0.14 + 0.12 * Math.abs(Math.sin(t * 8)), -0.1] : LEG_F, sad: false });
    if (waiting) { ctx.fillStyle = INK; ctx.font = '700 22px "LXGW WenKai TC", serif'; ctx.fillText('…', 320, 262); }
    // 175: stomach ache → run in → come out → name a suspect
    let x175 = 420, pose = {};
    const run = clamp((u - 1.2) / 0.7), back = clamp((u - 3.9) / 0.9);
    if (u < 1.2) pose = { armF: [0.1, 1.4], armB: [0.2, 1.3], sad: true, lean: 0.18, bob: Math.sin(t * 22) * 1.5 };
    else if (u < 1.9) { const rs = Math.sin(t * 22) * 0.9; x175 = lerp(420, DOOR, ease(run)); pose = { legF: [rs, 0.5], legB: [-rs, 0.5], armF: [0.1, 1.4], armB: [-rs, 1.2], lean: 0.25, sad: true, bob: -Math.abs(Math.sin(t * 22)) * 4 }; }
    else if (u < 3.6) x175 = null;
    else if (u < 4.8) { const ws = Math.sin(t * 9) * 0.5; x175 = lerp(DOOR, 420, ease(back)); pose = { f: -1, legF: [ws, 0.15], legB: [-ws, 0.15], armF: [-ws * 0.6, 0.2], armB: [ws * 0.6, 0.2], bob: -Math.abs(Math.sin(t * 9)) * 3, sad: true }; }
    else pose = { f: -1, armF: [1.0, 2.0], armB: [0.3, 1.5], sad: true };
    if (x175 !== null) {
      person({ x: x175, y: 360, f: 1, hair: true, ...pose });
      if (u < 1.9) { ctx.fillStyle = '#7fb2e8'; ctx.beginPath(); ctx.arc(x175 - 18, 296 + (t * 24) % 16, 4, 0, Math.PI * 2); ctx.fill(); }
    }
    if (u >= 4.8) bubble(430, 230, SUSPECTS[cycle % SUSPECTS.length], (u - 4.8) * 4, false);
  }
  const at = 5;
  const inK = ease((T - at + 0.4) / 0.35), outK = ease((T - at - 0.1) / 0.4);
  if (inK > 0 && outK < 1) { ctx.fillStyle = INK; ctx.fillRect(lerp(W, 0, inK) - outK * W, 0, W, H); }
}

// ---------- recap: every scene's souvenir goes into the "檢附資料" envelope ----------

const RECAP_GAP = 1.0, RECAP_FIRST = 0.6;
const RECAP_CLOSE = RECAP_FIRST + ATTACH.length * RECAP_GAP + 0.3, RECAP_STAMP = RECAP_CLOSE + 0.8;
function sceneRecap(t, prev) {
  sceneDone = t > RECAP_STAMP + 1;
  paper();
  line(40, 440, 760, 440, 2.5);
  const EX = 400, top = 300, bot = 440, L = EX - 120, R = EX + 120;
  const close = ease((t - RECAP_CLOSE) / 0.5);
  const flap = (front) => {
    const apex = lerp(top - 70, top + 75, close);
    if ((apex > top) !== front) return;
    ctx.fillStyle = front ? '#d9ae6f' : '#b9894c'; ctx.strokeStyle = INK; ctx.lineWidth = 2.5;
    ctx.beginPath(); ctx.moveTo(L, top); ctx.lineTo(EX, apex); ctx.lineTo(R, top); ctx.closePath(); ctx.fill(); ctx.stroke();
  };
  // envelope back + open flap
  ctx.fillStyle = '#c99a5b'; ctx.strokeStyle = INK; ctx.lineWidth = 2.5;
  ctx.beginPath(); ctx.rect(L, top, R - L, bot - top); ctx.fill(); ctx.stroke();
  flap(false);
  // the items, one by one: pop up with a label, then drop into the envelope
  ATTACH.forEach((it, k) => {
    const a = t - (RECAP_FIRST + k * RECAP_GAP);
    if (a < 0 || a > 1.05) return;
    const fly = ease((a - 0.6) / 0.45);
    const x = EX + Math.sin(fly * Math.PI) * (k % 2 ? 40 : -40), y = lerp(130, 350, fly * fly);
    ctx.save(); ctx.translate(x, y); ctx.rotate(fly * (k % 2 ? 0.5 : -0.5));
    const sc = ease(a / 0.3) * lerp(1.4, 0.7, fly); ctx.scale(sc, sc);
    it.draw();
    ctx.restore();
    if (a < 0.75) {
      ctx.save(); ctx.globalAlpha = clamp(a / 0.2) * clamp((0.75 - a) / 0.15);
      ctx.fillStyle = INK; ctx.font = '700 28px "LXGW WenKai TC", serif'; ctx.textAlign = 'center';
      ctx.fillText(it.label(), EX, 228);
      ctx.restore();
    }
  });
  // envelope front pocket
  ctx.fillStyle = '#d9ae6f'; ctx.strokeStyle = INK; ctx.lineWidth = 2.5;
  ctx.beginPath(); ctx.moveTo(L, top + 22); ctx.lineTo(R, top + 22); ctx.lineTo(R, bot); ctx.lineTo(L, bot); ctx.closePath(); ctx.fill(); ctx.stroke();
  ctx.fillStyle = INK; ctx.textAlign = 'center';
  ctx.font = '700 30px "LXGW WenKai TC", serif'; ctx.fillText('檢附資料', EX, top + 80);
  ctx.font = '16px "LXGW WenKai TC", serif'; ctx.fillStyle = '#5a4020'; ctx.fillText('180 字第 175 號', EX, top + 108);
  flap(true);
  // 收件 stamp
  const st = (t - RECAP_STAMP) / 0.3;
  if (st > 0) {
    const s = lerp(2.2, 1, ease(st));
    ctx.save(); ctx.translate(R - 34, bot - 40); ctx.rotate(-0.25); ctx.scale(s, s);
    ctx.globalAlpha = clamp(st * 2) * 0.9; ctx.strokeStyle = '#d23a3a'; ctx.fillStyle = '#d23a3a'; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.arc(0, 0, 30, 0, Math.PI * 2); ctx.stroke();
    ctx.font = '700 22px "LXGW WenKai TC", serif'; ctx.textAlign = 'center'; ctx.fillText('收件', 0, 8);
    ctx.restore();
  }
  if (crossed(prev, t, 999, RECAP_STAMP + 0.3)) spawn(EX, top - 20, 6, 'heart', 2);
  // the two of them watch from the sides and cheer at the stamp
  const cheer = t > RECAP_STAMP + 0.3, hop = cheer ? -Math.abs(Math.sin(t * 6)) * 6 : 0;
  person({ x: 170, y: 376, f: 1, glasses: true, bob: hop, armF: cheer ? [2.7, 0.3] : [0.3, 0.2], armB: cheer ? [2.4, 0.3] : [-0.2, 0.2], blush: cheer ? 1 : 0 });
  person({ x: 630, y: 376, f: -1, hair: true, bob: cheer ? -Math.abs(Math.sin(t * 6 + 1)) * 6 : 0, armF: cheer ? [2.7, 0.3] : [0.3, 0.2], armB: cheer ? [2.4, 0.3] : [-0.2, 0.2], laugh: cheer });
}

// ---------- player ----------
const SCENES = [sceneCover, sceneSushi, sceneMovie, sceneArcade, sceneCake, sceneWalk, sceneSplit, sceneBrunch, sceneNews, sceneThesis, sceneRecap, null];
const ENDING = SCENES.length - 1;
let idx = 0, start = performance.now(), last = start, prevT = 0;
let sceneT = 0;
const $ = id => document.getElementById(id);
const dots = $('dots');
SCENES.forEach(() => dots.appendChild(document.createElement('span')));

function show(i) {
  idx = clamp(i, 0, SCENES.length - 1);
  start = performance.now(); prevT = 0; parts = [];
  [...dots.children].forEach((d, k) => d.classList.toggle('on', k === idx));
  $('prev').disabled = idx === 0;
  $('next').disabled = idx === ENDING;
  c.hidden = idx === ENDING; $('form').hidden = idx !== ENDING;
  if (!c.hidden) resize();
  meal.count = 0; meal.eatAt = -99;
  const sc = SCENES[idx];
  $('act').hidden = ![sceneSushi, sceneArcade, sceneWalk].includes(sc);
  $('eat').hidden = sc !== sceneSushi; $('shoot').hidden = sc !== sceneArcade; $('walk').hidden = sc !== sceneWalk;
  walk.count = 0; walk.at = -99; hoop.visit = 0; $('walk').disabled = false;
  SHOOTERS.forEach(sh => sh.at = -99);
  updateEat(); updateShoot();
  $('hoopScore').textContent = hoop.score;
  msgs.total += msgs.thisVisit; msgs.thisVisit = 0;
  $('msgCount').textContent = msgs.total;
  if (idx === ENDING && !$('epi').hidden) epilogue();
}

function updateShoot() {
  $('shoot').textContent = '投一球 🏀';
}
$('shoot').onclick = () => {
  const sh = SHOOTERS[hoop.turn % 2];
  if (sceneT - sh.at < SHOT * 0.9) return; // still mid-throw
  sh.at = sceneT; hoop.turn++; hoop.visit++; hoop.score += 2;
  updateShoot();
};
function updateEat() {
  const b = $('eat');
  b.disabled = meal.count >= SUSHI_MAX;
  b.textContent = meal.count >= SUSHI_MAX ? '吃不下了 😵' : `吃下一盤 🍣（${meal.count}）`;
}
$('eat').onclick = () => {
  if (meal.count >= SUSHI_MAX || sceneT - meal.eatAt < EAT_TIME) return;
  meal.count++; meal.eatAt = sceneT;
  updateEat();
};

// "(結束)" card shown once a scene has played out; the scene keeps animating
let sceneDone = false, doneSince = null;
function endCard(k) {
  ctx.save(); ctx.globalAlpha = k;
  ctx.fillStyle = 'rgba(27,34,54,.85)'; ctx.beginPath(); ctx.roundRect(270, 432, 260, 60, 14); ctx.fill();
  ctx.textAlign = 'center';
  ctx.fillStyle = '#f7f9fc'; ctx.font = '700 24px "LXGW WenKai TC", serif'; ctx.fillText('（結束）', 400, 458);
  ctx.fillStyle = '#c9d3e0'; ctx.font = '15px "LXGW WenKai TC", serif'; ctx.fillText('按「下一幕」繼續 →', 400, 481);
  ctx.restore();
}
function frame(now) {
  const dt = Math.min((now - last) / 1000, 0.05); last = now;
  const t = sceneT = (now - start) / 1000;
  sceneDone = false;
  if (SCENES[idx]) { ctx.save(); SCENES[idx](t, prevT, dt); drawParts(dt); ctx.restore(); }
  if (sceneDone) { if (doneSince === null) doneSince = t; endCard(ease((t - doneSince) / 0.6)); } else doneSince = null;
  $('next').classList.toggle('pulse', sceneDone);
  prevT = t;
  requestAnimationFrame(frame);
}

// ---------- ending: approve / reject ----------
{
  const d = new Date();
  $('date').textContent = `中華民國 ${d.getFullYear() - 1911} 年 ${d.getMonth() + 1} 月 ${d.getDate()} 日`;
}
let rejects = 0, approved = false;
function approve() {
  if (approved) return; approved = true;
  setTimeout(sendMail, 2600);
  $('decide').hidden = true; $('result').hidden = false;
  const st = $('stamp'); st.hidden = false; st.classList.remove('in'); void st.offsetWidth; st.classList.add('in');

    h.className = 'fly'; h.textContent = '♥';
    h.style.left = Math.random() * 100 + '%';
    h.style.fontSize = 16 + Math.random() * 26 + 'px';

// fake delivery to 180's inbox → the reveal → "to be continued"
const later = ms => new Promise(r => setTimeout(r, ms));
async function sendMail() {
  const mail = $('mail'), bar = $('mailBar').firstElementChild;
  // pin the stamp where it is, so the growing form doesn't drag it down
  const st = $('stamp'); st.style.top = st.offsetTop + 'px'; st.style.bottom = 'auto';
  mail.hidden = false; mail.classList.add('appear');
  mail.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
  await later(50); bar.style.width = '99%';
  await later(3400); bar.style.transition = 'width .3s'; bar.style.width = '100%';
  await later(400);
  const d = new Date(), p2 = n => String(n).padStart(2, '0');
  $('mailStatus').textContent = '✓ 已送達 180 信箱'; $('mailStatus').classList.add('ok');
  $('mailWhen').textContent = `送達時間：中華民國 ${d.getFullYear() - 1911} 年 ${d.getMonth() + 1} 月 ${d.getDate()} 日 ${p2(d.getHours())}:${p2(d.getMinutes())}`;
  $('mailWhen').hidden = false;
  await later(2000);
  $('mailFine').hidden = false;
  await later(1800);
  $('epi').hidden = false; epilogue();
  mail.scrollIntoView({ behavior: 'smooth', block: 'end' });
}
let epiRunning = false;
function epilogue() {
  if (epiRunning) return; epiRunning = true;
  const cv = $('epi'), ctx2 = cv.getContext('2d'), EH = 220, t0 = performance.now();
  const loop = now => {
    const dpr = Math.min(devicePixelRatio || 1, 2);
    if (cv.width !== Math.round(cv.clientWidth * dpr)) { cv.width = Math.round(cv.clientWidth * dpr); cv.height = Math.round(cv.clientWidth * EH / W * dpr); }
    ctx2.setTransform(cv.width / W, 0, 0, cv.height / EH, 0, 0);
    const main = ctx; ctx = ctx2;
    const t = (now - t0) / 1000, sw = Math.sin(t * 6) * 0.45, bob = -Math.abs(Math.sin(t * 6)) * 3;
    ctx.fillStyle = PAPER; ctx.fillRect(0, 0, W, EH);
    // the ground scrolls by, so they keep walking together
    line(0, 196, W, 196, 2.5);
    for (let x = -((t * 60) % 46); x < W; x += 46) { line(x, 196, x - 4, 188, 1.5); line(x + 6, 196, x + 8, 189, 1.5); }
    const walkPose = k => ({ legF: [sw * k, 0.15], legB: [-sw * k, 0.15], bob });
    person({ x: 361, y: 150, s: 0.68, f: 1, glasses: true, ...walkPose(1), armF: [0.75, 0.1], armB: [-sw * 0.6, 0.2] });
    person({ x: 409, y: 150, s: 0.68, f: 1, hair: true, ...walkPose(-1), armB: [-0.75, -0.1], armF: [sw * 0.6, 0.2] });
    const hb = 1 + 0.12 * Math.sin(t * 5);
    heartPath(385, 70 - 10 * hb, 22 * hb); ctx.fillStyle = PINK; ctx.fill();
    ctx = main;
    if (!$('form').hidden) requestAnimationFrame(loop);
    else { epiRunning = false; cv.width = 0; }
  };
  requestAnimationFrame(loop);
}
$('no').onclick = () => {
  const b = $('no');
  if (b.classList.contains('approve')) return approve();
  // the first two presses do nothing; the third turns it into 核准
  if (++rejects >= 3) { b.textContent = '核准'; b.classList.add('approve'); }
};

$('prev').onclick = () => show(idx - 1);
$('next').onclick = () => show(idx + 1);
c.onclick = () => {
  const sc = SCENES[idx];
  if (sc === sceneSushi && meal.count < SUSHI_MAX) $('eat').click();
  else if (sc === sceneArcade) $('shoot').click();
  else if (sc === sceneWalk && walk.count < WALK_MAX) $('walk').click();
  else if (idx < ENDING) show(idx + 1);
};
$('walk').onclick = () => {
  if (walk.count >= WALK_MAX || sceneT - walk.at < WALK_TIME) return;
  walk.count++; walk.at = sceneT;
  if (walk.count >= WALK_MAX) $('walk').disabled = true;
};
addEventListener('keydown', e => { if (e.key === 'ArrowRight') show(idx + 1); if (e.key === 'ArrowLeft') show(idx - 1); });

resize(); show(0); requestAnimationFrame(frame);
